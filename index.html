<style>
:root{
  --navy:#0F406D;--navy2:#0A2E4E;--teal:#0099A1;--green:#00A57F;--orange:#E8590C;--red:#C92A2A;--amber:#E6A100;
  --bg:#F3F6FA;--card:#FFFFFF;--ink:#1F2933;--muted:#64748B;--line:#E2E8F0;--soft:#EAF2FA;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Lato,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:16px 16px 0;position:sticky;top:0;z-index:1000}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.2px}
.asof{font-size:12.5px;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:1200px;margin:12px auto 0}
.kpi{background:rgba(255,255,255,.09);border-radius:10px;padding:9px 11px}
.kpi b{display:block;font-size:22px;font-weight:900;line-height:1.1}
.kpi span{font-size:11.5px;opacity:.85}
.tabs{display:flex;gap:4px;max-width:1200px;margin:12px auto 0}
.tab{flex:1;background:transparent;border:0;color:#cfe0f0;padding:10px 6px;border-bottom:3px solid transparent;font-weight:700}
.tab.on{color:#fff;border-bottom-color:#FFB38F}
main{max-width:1200px;margin:0 auto;padding:14px 16px 90px}
.view{display:none}.view.on{display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input,.tools select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;min-width:0}
.tools input{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(15,64,109,.05)}
.ctop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cname{font-weight:900;color:var(--navy);font-size:15.5px}
.csub{color:var(--muted);font-size:12.5px;margin-top:2px}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.p-growing{background:#E3F7F1;color:#00805F}.p-dropping{background:#FFF0E6;color:#B4470A}
.p-silent{background:#FDECEC;color:var(--red)}.p-steady{background:var(--soft);color:var(--navy)}
.nums{display:flex;gap:18px;margin:12px 0 8px;align-items:baseline}
.big{font-size:28px;font-weight:900;color:var(--navy);line-height:1}
.lbl{font-size:11.5px;color:var(--muted)}
.delta{font-size:13px;font-weight:700}.up{color:#00805F}.down{color:var(--red)}
.mods{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 10px}
.mod{font-size:12px;background:var(--soft);color:var(--navy);border-radius:6px;padding:3px 7px}
.mod b{font-weight:900}
.mod.zero{background:#F1F5F9;color:#94A3B8}
.cbtns{display:flex;gap:8px}
.btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-weight:700;color:var(--navy)}
.btn.add.on{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.last{font-size:13px}
.last.warn{color:var(--red);font-weight:700}
#map,#rmap{height:calc(100vh - 230px);min-height:420px;border-radius:14px;border:1px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.empty{color:var(--muted);padding:30px;text-align:center}
.rlayout{display:grid;grid-template-columns:360px 1fr;gap:14px}
.rlist{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;max-height:calc(100vh - 230px);overflow:auto}
.stop{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.stop:last-child{border-bottom:0}
.sn{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.stop .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px}
.rcontrols{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.rcontrols select{padding:9px;border:1px solid var(--line);border-radius:10px;font:inherit}
.gm{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.gm a{display:block;text-align:center;background:var(--green);color:#fff;text-decoration:none;font-weight:700;border-radius:10px;padding:10px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
/* ficha */
#sheet{position:fixed;inset:0;background:rgba(10,46,78,.45);display:none;z-index:2000;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.sbox{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 28px}
@media(min-width:760px){#sheet{align-items:center}.sbox{border-radius:18px}}
.sclose{float:right;border:0;background:var(--soft);color:var(--navy);border-radius:50%;width:34px;height:34px;font-size:18px}
.sname{font-size:20px;font-weight:900;color:var(--navy);margin:2px 0}
.sec{margin-top:16px}
.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:700;font-size:12px}
.addr{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:8px}
.addr a{color:var(--navy);font-weight:700}
.warnbox{font-size:12px;color:#8A5A00;background:#FFF6DB;border-radius:8px;padding:6px 9px;margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:16px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;background:var(--teal);border-radius:5px 5px 0 0;min-height:2px}
.bar.cur i{background:var(--navy)}
.bar b{font-size:11.5px;color:var(--ink);margin-bottom:3px}
.bar span{font-size:11px;color:var(--muted);margin-top:4px}
/* notas */
textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical;background:#fff;color:var(--ink)}
.ncompose{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ncompose select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.nitem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.nmeta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.nmeta a{color:var(--navy);font-weight:700}
.nmeta .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px;line-height:1}
.ntext{white-space:pre-wrap;margin-top:4px;font-size:14px}
.newtag{display:inline-block;vertical-align:middle;margin-left:8px;padding:2px 8px;border-radius:999px;background:#E8F5EE;color:#1E7B4F;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.ncount{font-size:12px;color:var(--teal);font-weight:700;margin-left:6px}
@media(max-width:760px){
  header{position:static}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .rlayout{grid-template-columns:1fr}
  #rmap{height:55vh}
  .rlist{max-height:none}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div><h1>HDC · Jason's accounts</h1><div class="asof" id="asof"></div></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs">
    <button class="tab on" data-v="list">Accounts</button>
    <button class="tab" data-v="map">Map</button>
    <button class="tab" data-v="route">Route <span id="rcount"></span></button>
    <button class="tab" data-v="notes">Notes <span id="ncnt"></span></button>
  </div>
</header>
<main>
  <section class="view on" id="v-list">
    <div class="tools">
      <input id="q" type="search" placeholder="Search physician, specialty or city…" autocomplete="off">
      <select id="sort">
        <option value="mtd">Sort: most referrals this month</option>
        <option value="drop">Sort: biggest drop vs last month</option>
        <option value="days">Sort: longest without referring</option>
        <option value="ytd">Sort: most referrals this year</option>
        <option value="name">Sort: name A–Z</option>
      </select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </section>
  <section class="view" id="v-map">
    <div class="legend" id="legend"></div>
    <div id="map"></div>
  </section>
  <section class="view" id="v-route">
    <div class="rlayout">
      <div class="rlist">
        <div class="rcontrols">
          <select id="start">
            <option value="hdc">Start at HDC (Hollywood)</option>
            <option value="me">Start at my current location</option>
          </select>
          <button class="btn primary" id="opt">Optimize route</button>
        </div>
        <div id="stops"></div>
        <div class="gm" id="gm"></div>
        <div class="note">Tap “Add to route” on any physician (list or map). The order is optimized for the shortest drive; Google Maps opens with up to 9 stops per link.</div>
      </div>
      <div id="rmap"></div>
    </div>
  </section>
  <section class="view" id="v-notes">
    <div class="card ncompose">
      <select id="nwho"></select>
      <textarea id="ntext" rows="4" placeholder="Write a note… (visit, what the doctor said, next steps)"></textarea>
      <button class="btn primary" id="nsave">Save note</button>
    </div>
    <div class="tools"><input id="nq" type="search" placeholder="Search notes…" autocomplete="off">
      <button class="btn" id="nexp" style="flex:none;padding:9px 14px">Export</button></div>
    <div id="nall"></div>
  </section>
</main>

    `<span class="mod ${m[k] ? "" : "zero"}">${k} <b>${m[k] || 0}</b></span>`).join("");
}
function renderList(){
  chips();
  const q = document.getElementById("q").value.trim().toLowerCase();
  const sort = document.getElementById("sort").value;
  let L = A.filter(a => filt === "all" || (filt === "route" ? route.includes(a.id) : a.st === filt));
  if (q) L = L.filter(a => [a.name, a.specialty, ...(a.locations || []).map(l => l.city), ...(a.members || []),
    ...notesOf(a.id).map(n => n.text)]
    .join(" ").toLowerCase().includes(q));
  const by = {mtd:(x,y)=>y.mtd-x.mtd||y.ytd-x.ytd, drop:(x,y)=>x.delta-y.delta,
    days:(x,y)=>(y.days_since??9999)-(x.days_since??9999), ytd:(x,y)=>y.ytd-x.ytd, name:(x,y)=>x.name.localeCompare(y.name)};
  L.sort(by[sort]);
  const g = document.getElementById("grid");
  if (!L.length) { g.innerHTML = `<div class="empty">No physicians match.</div>`; return; }
  g.innerHTML = L.map(a => {
    const city = ((a.locations[0] || {}).city || "No address on file") + (a.addr_note ? " · ⚠ address not confirmed" : "");
    const d = a.delta, dTxt = d === 0 ? "same as last month" : (d > 0 ? "+" : "") + d + " vs last month";
    return `<div class="card">
      <div class="ctop"><div><div class="cname">${esc(a.name)}${newTag(a)}</div>
        <div class="csub">${esc(a.specialty || "Specialty n/a")} · ${esc(city)}</div></div>
        <span class="pill p-${a.st}">${LBL[a.st]}</span></div>
      <div class="nums"><div><div class="big">${a.mtd}</div><div class="lbl">this month</div></div>
        <div><div class="delta ${d > 0 ? "up" : d < 0 ? "down" : ""}">${dTxt}</div>${lastTxt(a)}${nBadge(a.id)}</div></div>
      <div class="mods">${modChips(a.mods_mtd)}</div>
      <div class="cbtns"><button class="btn" data-d="${a.id}">Details</button>
        ${a.locations.length ? `<a class="btn" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${gmUrl(a.locations[0])}">📍 Google Maps</a>` : ""}
        <button class="btn add ${route.includes(a.id) ? "on" : ""}" data-r="${a.id}" ${a.locations.length ? "" : "disabled title='No address'"}>
        ${route.includes(a.id) ? "✓ In route" : "+ Add to route"}</button></div></div>`;
  }).join("");
}
document.getElementById("grid").onclick = e => {
  const d = e.target.closest("[data-d]"), r = e.target.closest("[data-r]");
  if (d) openSheet(d.dataset.d); if (r) toggleRoute(r.dataset.r);
};

// ---------- notas: se guardan en este celular (localStorage), sin servidor ----------
// Felipe (2026-10-26): sin PIN ni Google Sheet. Las notas viven en el navegador de quien
// las escribe; el botón Export las baja en un .txt como respaldo.
const LS = {get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e) { return d; } },
            set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } }};
let notes = LS.get("jason_notes", []), openId = null;
const allNotes = () => notes.slice().sort((a, b) => b.ts.localeCompare(a.ts));
const notesOf = id => allNotes().filter(n => n.id === id);
const newTag = a => a.new ? `<span class="newtag">New</span>` : "";
const nBadge = id => { const c = notesOf(id).length; return c ? `<span class="ncount">📝 ${c}</span>` : ""; };
const fmtTs = t => new Date(t).toLocaleString("en-US", {month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit"});
function saveNotes(){
  if (!LS.set("jason_notes", notes)) alert("Could not save the note on this device (private browsing?).");
  refreshNotes();
}
function addNote(id, text){
  text = text.trim(); if (!text) return false;
  const a = A.find(x => x.id === id);
  notes.push({nid: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), ts: new Date().toISOString(),
              id: id || "", name: a ? a.name : "", text});
  saveNotes(); return true;
}
function delNote(nid){
  if (!confirm("Delete this note?")) return;
  notes = notes.filter(n => n.nid !== nid); saveNotes();
}
function exportNotes(){
  const txt = allNotes().map(n => `${fmtTs(n.ts)} · ${n.name || "General"}\n${n.text}\n`).join("\n");
  const url = URL.createObjectURL(new Blob([txt || "No notes."], {type: "text/plain"}));
  const l = document.createElement("a"); l.href = url; l.download = "jason-notes-" + new Date().toISOString().slice(0, 10) + ".txt";
  document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function noteHtml(n, conNombre){
  const quien = !conNombre ? "" : n.id && A.some(a => a.id === n.id)
    ? ` · <a href="#" data-open="${esc(n.id)}">${esc(n.name)}</a>` : " · General";
  return `<div class="nitem"><div class="nmeta">${fmtTs(n.ts)}${quien}
    <button class="x" data-del="${esc(n.nid)}" title="Delete">×</button></div><div class="ntext">${esc(n.text)}</div></div>`;
}
function renderFicha(){
  const box = document.getElementById("flist"); if (!box || !openId) return;
  const L = notesOf(openId);
  box.innerHTML = L.length ? L.map(n => noteHtml(n, false)).join("") : `<div class="lbl">No notes yet.</div>`;
}
function refreshNotes(){
  const q = document.getElementById("nq").value.trim().toLowerCase();
  const L = allNotes().filter(n => !q || (n.text + " " + n.name).toLowerCase().includes(q));
  document.getElementById("nall").innerHTML = L.length ? L.map(n => noteHtml(n, true)).join("")
    : `<div class="empty">${q ? "No notes match." : "No notes yet."}</div>`;
  document.getElementById("ncnt").textContent = notes.length ? `(${notes.length})` : "";
  renderFicha(); renderList();
}
document.getElementById("nwho").innerHTML = `<option value="">General note (no physician)</option>` +
  A.slice().sort((x, y) => x.name.localeCompare(y.name)).map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("");
document.getElementById("nsave").onclick = () => {
  const t = document.getElementById("ntext");
  if (addNote(document.getElementById("nwho").value, t.value)) t.value = "";
};
document.getElementById("nq").oninput = refreshNotes;
document.getElementById("nexp").onclick = exportNotes;
document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]"), d = e.target.closest("[data-del]"), f = e.target.closest("[data-fsave]");
  if (o) { e.preventDefault(); openSheet(o.dataset.open); }
  if (d) delNote(d.dataset.del);
  if (f) { const t = document.getElementById("ftext"); if (addNote(openId, t.value)) t.value = ""; }
});

// ---------- ficha ----------
function openSheet(id){
  const a = A.find(x => x.id === id);
  const months = S.months, vals = months.map(m => a.months[m] || 0), mx = Math.max(1, ...vals);
  const bars = months.map((m, i) => `<div class="bar ${i === months.length - 1 ? "cur" : ""}"><b>${vals[i]}</b>
      <i style="height:${Math.round(vals[i] / mx * 100)}%"></i><span>${mname(m)}</span></div>`).join("");
  const rows = MODS.filter(k => a.mods_ytd[k] || a.mods_90[k] || a.mods_mtd[k]).map(k =>
    `<tr><td>${k}</td><td>${a.mods_mtd[k] || 0}</td><td>${a.mods_90[k] || 0}</td><td>${a.mods_ytd[k] || 0}</td></tr>`).join("")
    || `<tr><td colspan="4">No referrals this year.</td></tr>`;
  const ex = a.top_exams_90.length ? a.top_exams_90.map(([e, n]) => `<tr><td>${esc(e)}</td><td>${n}</td></tr>`).join("")
    : `<tr><td colspan="2">None in the last 90 days.</td></tr>`;
  const locs = a.locations.length ? a.locations.map(l => {
    const q = encodeURIComponent(`${l.address}, ${l.city}, FL ${l.zip}`);
    const tel = l.phone ? `<br>📞 <a href="tel:${l.phone.replace(/\D/g,"")}">${esc(l.phone)}</a>` : "";
    return `<div class="addr">${l.who ? "<b>" + esc(l.who) + "</b><br>" : ""}${esc(l.address)}, ${esc(l.city)}, FL ${esc(l.zip)}${tel}
      <br><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${q}">Directions ↗</a></div>`;
  }).join("") : `<div class="addr">No address found in the NPI registry.</div>`;
  const warn = a.addr_note ? `<div class="warnbox">⚠ ${esc(a.addr_note)}</div>`
    : ["media","baja"].includes(a.addr_confidence)
    ? `<div class="warnbox">⚠ Address taken from the NPI registry; more than one match was found. Please confirm on the first visit.</div>` : "";
  document.getElementById("sbox").innerHTML = `
    <button class="sclose" onclick="closeSheet()">×</button>
    <span class="pill p-${a.st}">${LBL[a.st]}</span>
    <div class="sname">${esc(a.name)}${newTag(a)}</div>
    <div class="csub">${esc(a.specialty || "")}${a.members.length ? " · " + a.members.map(esc).join(", ") : ""}</div>
    <div class="nums"><div><div class="big">${a.mtd}</div><div class="lbl">this month</div></div>
      <div><div class="big" style="color:#64748B">${a.prev_mtd}</div><div class="lbl">same days last month</div></div>
      <div><div class="big" style="color:#0099A1">${a.ytd}</div><div class="lbl">this year</div></div></div>
    ${lastTxt(a)}${a.avg_jan_may ? ` · <span class="lbl">Jan–May avg: ${a.avg_jan_may}/month</span>` : ""}
    <div class="sec"><h3>Referrals by month</h3><div class="bars">${bars}</div></div>
    <div class="sec"><h3>Modalities</h3><table><tr><th>Modality</th><th>This month</th><th>Last 90 days</th><th>This year</th></tr>${rows}</table></div>
    <div class="sec"><h3>Most ordered exams · last 90 days</h3><table>${ex}</table></div>
    <div class="sec"><h3>Office</h3>${locs}${warn}</div>
    <div class="sec"><h3>Visit notes</h3>
      <textarea id="ftext" rows="3" placeholder="What happened on this visit?"></textarea>
      <button class="btn primary" style="width:100%;margin-top:8px" data-fsave="1">Save note</button>
      <div id="flist" style="margin-top:10px"></div></div>
    <div class="cbtns" style="margin-top:14px"><button class="btn add ${route.includes(a.id) ? "on" : ""}" ${a.locations.length ? "" : "disabled"}
      onclick="toggleRoute('${a.id}');openSheet('${a.id}')">${route.includes(a.id) ? "✓ In route" : "+ Add to route"}</button></div>`;
  document.getElementById("sheet").classList.add("on");
  openId = id; renderFicha();
}
function closeSheet(){ document.getElementById("sheet").classList.remove("on"); openId = null; }
document.getElementById("sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };

// ---------- mapas ----------
// Esri World Street Map: gratis y sin llave (CARTO empezo a pedir API key)
const tiles = () => L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
  {maxZoom: 19, attribution: "Tiles © Esri — Esri, HERE, Garmin, OpenStreetMap contributors"});
let map, rmap, layer, rlayer;
function hdcMarker(m){
  L.marker([HDC.lat, HDC.lng], {icon: L.divIcon({className: "", html:
    `<div style="background:#0F406D;color:#fff;font:900 11px Lato;padding:4px 7px;border-radius:7px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)">HDC</div>`,
    iconSize: [40, 22], iconAnchor: [20, 11]})}).addTo(m).bindPopup("<b>Hollywood Diagnostics Center</b>");
}
function popup(a, l){
  return `<b>${esc(a.name)}</b><br>${esc(a.specialty || "")}<br>${esc(l.address)}, ${esc(l.city)}${a.addr_note ? ' <span style="color:#8A5A00">(⚠ not confirmed)</span>' : ""}<br>
    This month: <b>${a.mtd}</b> (last month ${a.prev_mtd})<br>${a.days_since === null ? "No referrals this year" : "Last referral: " + a.days_since + " days ago"}<br>
    <a href="#" onclick="openSheet('${a.id}');return false">Details</a> ·
    <a target="_blank" rel="noopener" href="${gmUrl(l)}">Google Maps ↗</a> ·
    <a href="#" onclick="toggleRoute('${a.id}');return false">${route.includes(a.id) ? "Remove from route" : "Add to route"}</a>`;
}
function refreshMarkers(){
  if (!map) return;
  layer.clearLayers();
  A.forEach(a => a.locations.forEach(l => {
    L.circleMarker([l.lat, l.lng], {radius: route.includes(a.id) ? 10 : 7, color: route.includes(a.id) ? "#0099A1" : "#fff",
      weight: route.includes(a.id) ? 3 : 1.5, fillColor: COL[a.st], fillOpacity: .95}).bindPopup(popup(a, l)).addTo(layer);
  }));
}
function initMap(){
  if (map) { map.invalidateSize(); return; }
  map = L.map("map").setView([HDC.lat, HDC.lng], 11); tiles().addTo(map); hdcMarker(map);
  layer = L.layerGroup().addTo(map); refreshMarkers();
  const pts = A.flatMap(a => a.locations.map(l => [l.lat, l.lng]));
  if (pts.length) map.fitBounds(pts, {padding: [30, 30]});
  document.getElementById("legend").innerHTML = Object.keys(LBL).map(k =>
    `<span><span class="dot" style="background:${COL[k]}"></span>${LBL[k]} · ${A.filter(a => a.st === k).length}</span>`).join("") +
    `<span>${A.filter(a => !a.locations.length).length} without address</span>`;
}

// ---------- ruta ----------
const hav = (a, b) => { const R = 3958.8, r = Math.PI / 180, dl = (b.lat - a.lat) * r, dg = (b.lng - a.lng) * r;
  const h = Math.sin(dl/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dg/2)**2; return 2 * R * Math.asin(Math.sqrt(h)); };
let origin = HDC;
function stopsOf(){ return route.map(id => A.find(a => a.id === id)).filter(a => a && a.locations.length)
  .map(a => ({id: a.id, name: a.name, lat: a.locations[0].lat, lng: a.locations[0].lng, a})); }
function optimize(){
  const pts = stopsOf(); if (pts.length < 2) return;
  // vecino mas cercano + 2-opt
  let cur = origin, left = pts.slice(), ord = [];
  while (left.length) { left.sort((x, y) => hav(cur, x) - hav(cur, y)); cur = left.shift(); ord.push(cur); }
  const len = o => o.reduce((s, p, i) => s + hav(i ? o[i - 1] : origin, p), 0);
  let best = len(ord), mejoro = true;
  while (mejoro) { mejoro = false;
    for (let i = 0; i < ord.length - 1; i++) for (let j = i + 1; j < ord.length; j++) {
      const c = ord.slice(0, i).concat(ord.slice(i, j + 1).reverse(), ord.slice(j + 1)), l = len(c);
      if (l < best - 1e-9) { ord = c; best = l; mejoro = true; } } }
  route = ord.map(p => p.id); saveRoute(); renderRoute(); renderList();
}
document.getElementById("opt").onclick = () => {
  if (document.getElementById("start").value === "me" && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(p => { origin = {lat: p.coords.latitude, lng: p.coords.longitude, name: "My location"}; optimize(); },
      () => { alert("Could not get your location; starting at HDC."); origin = HDC; optimize(); });
  } else { origin = HDC; optimize(); }
};
function renderRoute(){
  document.getElementById("rcount").textContent = route.length ? `(${route.length})` : "";
  const pts = stopsOf(), box = document.getElementById("stops");
  box.innerHTML = pts.length ? pts.map((p, i) => `<div class="stop"><div class="sn">${i + 1}</div>
      <div><b>${esc(p.name)}</b><div class="csub">${esc(p.a.locations[0].address)}, ${esc(p.a.locations[0].city)}</div></div>
      <button class="x" onclick="toggleRoute('${p.id}')" title="Remove">×</button></div>`).join("")
    : `<div class="empty">No stops yet. Add physicians from the list or the map.</div>`;
  const total = pts.reduce((s, p, i) => s + hav(i ? pts[i - 1] : origin, p), 0);
  const gm = document.getElementById("gm"); gm.innerHTML = "";
  if (pts.length) {
    const o = origin === HDC ? `${HDC.lat},${HDC.lng}` : `${origin.lat},${origin.lng}`;
    for (let i = 0, k = 1; i < pts.length; i += 10, k++) {
      const tramo = pts.slice(i, i + 10), dest = tramo[tramo.length - 1], ways = tramo.slice(0, -1);
      const from = i === 0 ? o : `${pts[i - 1].lat},${pts[i - 1].lng}`;
      const url = `https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=${from}&destination=${dest.lat},${dest.lng}` +
        (ways.length ? "&waypoints=" + encodeURIComponent(ways.map(w => `${w.lat},${w.lng}`).join("|")) : "");
      gm.innerHTML += `<a target="_blank" rel="noopener" href="${url}">Open in Google Maps${pts.length > 10 ? ` · part ${k}` : ""} ↗</a>`;
    }
    gm.innerHTML += `<div class="note">~${total.toFixed(1)} miles in a straight line between stops (driving distance will be longer).</div>`;
  }
  if (rmap) drawRoute();
}
function drawRoute(){
  rlayer.clearLayers();
  const pts = stopsOf(), line = [[origin.lat, origin.lng], ...pts.map(p => [p.lat, p.lng])];
  pts.forEach((p, i) => L.marker([p.lat, p.lng], {icon: L.divIcon({className: "", html:
    `<div style="background:${COL[p.a.st]};color:#fff;font:900 12px Lato;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)">${i + 1}</div>`,
    iconSize: [24, 24], iconAnchor: [12, 12]})}).bindPopup(popup(p.a, p.a.locations[0])).addTo(rlayer));
  if (pts.length) { L.polyline(line, {color: "#0099A1", weight: 3, dashArray: "6 6"}).addTo(rlayer); rmap.fitBounds(line, {padding: [30, 30]}); }
}
function initRMap(){
  if (rmap) { rmap.invalidateSize(); drawRoute(); return; }
  rmap = L.map("rmap").setView([HDC.lat, HDC.lng], 11); tiles().addTo(rmap); hdcMarker(rmap);
  rlayer = L.layerGroup().addTo(rmap); drawRoute();
}

// ---------- pestañas ----------
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + t.dataset.v));
  if (t.dataset.v === "map") setTimeout(initMap, 30);
  if (t.dataset.v === "route") setTimeout(initRMap, 30);
});
renderList(); renderRoute(); refreshNotes();
</script>
